# The browser sees one origin: nginx serves the dashboard and proxies /api and /ws to the api
# service, so the session cookie stays SameSite=Strict and no CORS is needed
# (docs/auth-and-threat-model.md A2.14).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The trailing slash strips the prefix: /api/health -> http://api:8000/health
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Countdown channel (T1-11), WebSocket upgrade.
    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: client-side routes such as /incidents/inc-1 load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
