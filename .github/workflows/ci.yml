name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.2
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: icd
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: icd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icd -d icd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://icd:ci-only-not-secret@localhost:5432/icd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose .

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: Start stack and wait for all healthchecks
        run: docker compose up --build --detach --wait --wait-timeout 180
      - run: curl -fsS http://localhost:8000/health
      - run: curl -fsS http://localhost:8080/
      - run: curl -fsS http://localhost:8080/api/health
      - name: Check migrations reached revision 0003
        run: |
          version=$(docker compose exec -T db psql -U icd -d icd -tAc "SELECT version_num FROM alembic_version")
          echo "alembic_version: $version"
          test "$version" = "0003"
      - name: Check the worker runs the response expiry loop (C5)
        run: docker compose logs worker | grep -q "response expiry loop started"
      - name: Upload the correlation fixture through nginx and wait for the job
        run: |
          body=$(curl -fsS -F dataset_id=fixture -F file=@fixtures/correlation/events.json http://localhost:8080/api/uploads)
          echo "$body"
          job_id=$(echo "$body" | jq -r .job_id)
          for _ in $(seq 1 60); do
            job=$(curl -fsS "http://localhost:8080/api/jobs/$job_id")
            state=$(echo "$job" | jq -r .state)
            if [ "$state" = done ] || [ "$state" = failed ]; then break; fi
            sleep 1
          done
          echo "$job"
          test "$state" = done
          test "$(echo "$job" | jq '.counts.events_stored')" = "$(jq length fixtures/correlation/events.json)"
          upload_id=$(echo "$body" | jq -r .upload_id)
          flagged=$(curl -fsS "http://localhost:8080/api/uploads/$upload_id/events?label_status=flagged&limit=500" | jq '.items | length')
          test "$flagged" = "$(jq '[.[] | select(.label.status == "flagged")] | length' fixtures/correlation/events.json)"
      - name: Show logs on failure
        if: failure()
        run: docker compose ps && docker compose logs
      - if: always()
        run: docker compose down --volumes
