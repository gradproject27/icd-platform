name: icd

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      LLM_BACKEND: ${LLM_BACKEND:-mock}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
      # Development identity for analyst decisions until login exists (T2-15, decision S8-D4).
      ICD_DEV_USER: ${ICD_DEV_USER:-}
      ICD_DEV_ROLE: ${ICD_DEV_ROLE:-}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Through the shell: Podman splits an exec-form argument at its spaces, so the one-line
      # Python check ran as `python -c import` there and the API never became healthy.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Same image as the api: the worker imports the contracts, parsers and job code (D9).
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      LLM_BACKEND: ${LLM_BACKEND:-mock}
      UPLOAD_DIR: /data/uploads
      # C1 decision F3: the analysis job's model backend (stub | openai_http | hpc_batch);
      # the variables each one needs are listed in .env.example.
      ICD_ANALYSIS_BACKEND: ${ICD_ANALYSIS_BACKEND:-stub}
      ICD_LLM_ENDPOINT: ${ICD_LLM_ENDPOINT:-}
      ICD_LLM_MODEL: ${ICD_LLM_MODEL:-}
      ICD_LLM_SITE: ${ICD_LLM_SITE:-local}
      ICD_LLM_API_KEY: ${ICD_LLM_API_KEY:-}
      ICD_LLM_NO_THINKING: ${ICD_LLM_NO_THINKING:-}
      # replay (task 31): recorded real-model answers; empty = every file in app/analysis/replay_data
      ICD_REPLAY_FILES: ${ICD_REPLAY_FILES:-}
      ICD_HPC_SSH_TARGET: ${ICD_HPC_SSH_TARGET:-}
      ICD_HPC_SSH_KEY: ${ICD_HPC_SSH_KEY:-}
      ICD_HPC_REMOTE_DIR: ${ICD_HPC_REMOTE_DIR:-}
      ICD_HPC_SBATCH_SCRIPT: ${ICD_HPC_SBATCH_SCRIPT:-}
      ICD_HPC_MODEL: ${ICD_HPC_MODEL:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      # The api applies the migrations before it reports healthy.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db-data:
  # Uploaded files, shared by api and worker (D4).
  uploads:
