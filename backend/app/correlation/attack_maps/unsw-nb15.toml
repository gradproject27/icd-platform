# UNSW-NB15 attack_cat -> MITRE ATT&CK (risk-v1 step 2, decision RV1-D9). Also used for
# NF-UNSW-NB15-v3, whose class names are the same (it has Backdoor only).
# Tactics are those of P4's tactics.toml (a test keeps the two equal). Each technique was
# checked in Enterprise ATT&CK 20.1 (mitre-attack/attack-stix-data, read 25 Nov 2026).
# quality: exact = the label names one technique; partial = the label covers several, the main
# one is given; category-only = the name implies no certain tactic, the stage is kept from
# correlation.toml (decision of 25 Nov 2026). Review: Sara (C3).
dataset_id = "unsw-nb15"
config_version = "unsw-nb15-attack-v1"
attack_version = "20.1"
source = "UNSW-NB15 dataset page (category names only); P4 tactics.toml"

[labels.Reconnaissance]
techniques = [["T1595", "Active Scanning"]]
tactics = ["TA0043"]
stage = 1
quality = "partial"

[labels.Fuzzers]
techniques = [["T1595.002", "Vulnerability Scanning"]]
tactics = ["TA0043"]
stage = 1
quality = "partial"

[labels.Analysis]
